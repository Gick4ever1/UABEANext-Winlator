name: Build UABEA Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Build and Optimize
      run: |
        dotnet publish UABEANext4.Desktop/UABEANext4.Desktop.csproj -c Release -f net8.0 -r win-x64 --self-contained true /p:PublishSingleFile=false /p:PublishReadyToRun=true /p:ServerGarbageCollection=false

    - name: Copy Required Class Data and Plugins
      run: |
        if (Test-Path "UABEANext4.Desktop\classdata.tpk") {
          Copy-Item "UABEANext4.Desktop\classdata.tpk" "UABEANext4.Desktop\bin\Release\net8.0\win-x64\publish\"
        }
        if (Test-Path "classdata.tpk") {
          Copy-Item "classdata.tpk" "UABEANext4.Desktop\bin\Release\net8.0\win-x64\publish\"
        }

    - name: Upload
      uses: actions/upload-artifact@v6
      with:
        name: uabea-windows
        path: UABEANext4.Desktop/bin/Release/net8.0/win-x64/publish/
