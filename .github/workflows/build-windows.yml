name: Build UABEA Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Build and Optimize
      run: |
        dotnet publish UABEANext4.sln -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=true /p:ServerGarbageCollection=false /p:TrimMode=partial

    - name: Upload
      uses: actions/upload-artifact@v6
      with:
        name: uabea-windows
        path: UABEANext4.Desktop/bin/Release/net8.0/win-x64/publish/
